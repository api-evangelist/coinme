                    type: object
                    properties:
                      timestamp:
                        type: string
                      httpStatus:
                        type: string
                      errorData:
                        type: array
                        items:
                          properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          type: object
                      path:
                        type: string
                      retry:
                        type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"data\": null,\n  \"errorResponse\": {\n    \"httpStatus\":\"200\",\n    \"timestamp\":\"2022-02-01T18:59:28.297Z\",//UTC\n\t\t\"path\":\"/external/partners/v1/payment-method\",    \n      \"errorData\": [\n      {\n        \"errorCode\":\"123-123-123-123\", //The error code is just a sample showing the structure of the error code.\n        \"message\":\"Invalid account id\"\n      }\n    ]\n}"
      security:
      - x-api-key: []
      tags:
      - Paymentmethods
  /paymentmethods/status:
    get:
      description: Check if a customer has reached their payment method limits. Returns the status of various payment method thresholds to determine if the customer can add additional payment methods.
      responses:
        '200':
          description: ''
          content:
            application/json:
              examples:
                OK:
                  summary: OK
                  value: "{\n  \"data\": {\n    \"maxReached\": 3, // indicates if an account has reached the maximum number of payment methods they can add (verified or unverified, the default is 5)\n    \"maxTotalReached\": 5, // indicates if the account has reached the maximum number of verified payment methods they can have (default 3)\n    \"maxVerifiedReached\": 10 // inidicates whether the account can add any more payment methods\n  },\n  \"errorResponse\": null\n}"
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: If there are no client errors this field will be filled out and errorResponse will be null
                    properties:
                      maxReached:
                        type: boolean
                        description: True if no more cards can be added
                      maxVerifiedReached:
                        type: boolean
                        description: True if no more cards can be verified
                      maxTotalReached:
                        type: string
                        description: True if the total number of cards in any status has been reached
                  errorResponse:
                    type: object
                    description: If there are client errors, this field will be filled out and data will be null
                    properties:
                      timestamp:
                        type: string
                      httpStatus:
                        type: string
                      errorData:
                        type: array
                        items:
                          properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          type: object
                      path:
                        type: string
                      retry:
                        type: string
                required:
                - data
        '400':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Bad Request:
                  summary: Bad Request
                  value: "{\n  \"data\": null,\n  \"errorResponse\": {\n    \"httpStatus\": \"200\",\n    \"timestamp\": \"2025-01-09T14:30:00.000Z\", //UTC\n    \"path\": \"/services/paymentmethods/status GET\",\n    \"errorData\": [\n      {\n        \"errorCode\":\"123-123-123-123\", //The error code is just a sample showing the structure of the error code.\n        \"message\":\"Customer Id not found\"\n      }\n    ]\n  }\n}"
          description: Bad Request
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
          default: Bearer ******
        required: true
        description: Bearer token {authorize} endpoint
      - in: header
        name: User-Agent
        schema:
          type: string
        required: true
        description: Partner User Agent ID (provided by Coinme)
      - in: query
        name: customerId
        schema:
          type: string
        description: Unique customer identifier
        required: true
      operationId: get_paymentmethods-status
      summary: Get Payment Method Status
      security:
      - x-api-key: []
      tags:
      - Paymentmethods
components:
  securitySchemes:
    basic:
      type: http
      scheme: basic
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
