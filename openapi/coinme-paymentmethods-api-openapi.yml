                      cardProvider:
                        type: string
                        example: Visa
                      card:
                        type: object
                        properties:
                          cardNumber:
                            type: string
                            example: '123412321'
                          month:
                            type: string
                            example: '03'
                          year:
                            type: string
                            example: '2024'
