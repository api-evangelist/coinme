                            type: string
                            example: John
                          lastName:
                            type: string
                            example: Doe
                          country:
                            type: string
                            example: US
                          addressLine1:
                            type: string
                            example: 11 Creekside St.
                          addressLine2:
                            type: string
                            example: Additional line
                          zipCode:
                            type: string
                            example: '33414'
                          city:
                            type: string
                            example: West Palm Beach
                          state:
                            type: string
                            example: FL
                      status:
                        type: string
                        example: DELETED
                        enum:
                        - CREATED
                        - VERIFIED
                        - DECLINED
                        - STAGED
                        - DELETED
                      buySupported:
                        type: boolean
                        example: false
                        default: true
                      sellSupported:
                        type: boolean
                        example: true
                        default: true
                      createdAt:
                        type: string
                        example: 1714560970
                        default: 0
                      deletedAt:
                        type: string
                        example: 1714560970
                        default: 0
                    description: If there are no client errors this field will be filled out and errorResponse will be null
