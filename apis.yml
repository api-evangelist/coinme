name: Coinme
description: >-
  Coinme is a Seattle-based regulated cryptocurrency company that offers Crypto-as-a-Service (CaaS):
  modular API infrastructure that lets platforms embed crypto without building it from scratch. Its
  Crypto-as-a-Service API covers KYC/AML customer and business onboarding, executable and
  informational buy/sell quotes, buy/sell and sell-all transactions, custodial and external-wallet
  sends, crypto asset balances, cash on/off-ramp via barcode order templates at physical locations,
  transaction history and limits, supported chains, and location licensing. It ships an embeddable
  Widget, a PCI-scope-reducing Vault SDK for secure card capture, and a Risk Engine SDK for real-time
  fraud signals, plus HMAC-signed webhook notifications. Coinme is backed by Pantera Capital.
